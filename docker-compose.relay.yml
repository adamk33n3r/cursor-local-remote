# Relay: Login + Host list. Does not spawn Agent.
#
# Private GHCR image. Once:
#   gh auth token | docker login ghcr.io -u adamk33n3r --password-stdin
#   docker compose -f docker-compose.relay.yml up
# Local rebuild: uncomment `build:` and use `up --build`.
#
# Clients: http://<this-machine>:3200. Hosts set RELAY_URL to that origin
# (host.docker.internal:3200 from a Host container; relay:3200 on a shared network).
# A forward-auth reverse proxy in front of none is optional, not required.

services:
  relay:
    # build: ./packages/cursor-remote-relay
    image: ghcr.io/adamk33n3r/cursor-remote-relay:latest
    ports:
      - "${RELAY_PORT:-3200}:3200"
    environment:
      # none | password. This file defaults to none (Host list, no splash, no Logout,
      # leftover credentials unused, no unsecured stdout warning).
      # password: splash Login, cookie, Logout when both username and password are set.
      # password with either credential unset is misconfig: process up, list not served.
      LOGIN_MODE: ${LOGIN_MODE:-none}
      # Password Login username. Required with LOGIN_PASSWORD for password mode.
      # Unused when LOGIN_MODE=none.
      LOGIN_USERNAME: ${LOGIN_USERNAME:-}
      # Password Login password. Required with LOGIN_USERNAME for password mode.
      # Unused when LOGIN_MODE=none. Never printed on stdout.
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:-}
    volumes:
      # Image runs as root; default state dir is ~/.cursor-remote-relay.
      - relay-state:/root/.cursor-remote-relay
    restart: unless-stopped

volumes:
  relay-state:

# Optional named network Hosts on this engine can join (see docker-compose.host.yml).
# networks:
#   default:
#     name: cursor-remote
